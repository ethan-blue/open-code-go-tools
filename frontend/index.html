<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ocgt - Claude API Proxy Dashboard Center</title>
    <style>
        html,
        body,
        #root {
            min-height: 100%;
        }

        html,
        body {
            margin: 0;
            background: #f8fafc;
        }
    </style>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const requestedTheme = savedTheme || 'system';
            const resolvedTheme = requestedTheme === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : (requestedTheme === 'dark' ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', resolvedTheme);
            const shellBg = resolvedTheme === 'dark' ? '#0b0d10' : '#f8fafc';
            document.documentElement.style.backgroundColor = shellBg;
            if (document.body) {
                document.body.style.backgroundColor = shellBg;
            }

            const savedAccent = localStorage.getItem('accent-hue');
            if (savedAccent !== null && savedAccent !== '') {
                const hue = Math.max(0, Math.min(360, parseInt(savedAccent, 10) || 174));
                document.documentElement.style.setProperty('--accent-h', hue);
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
