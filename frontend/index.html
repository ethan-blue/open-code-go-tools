<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ocgt - Claude API Proxy Dashboard Center</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const requestedTheme = savedTheme || 'system';
            const resolvedTheme = requestedTheme === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : (requestedTheme === 'dark' ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', resolvedTheme);

            const savedAccent = localStorage.getItem('accent-hue');
            if (savedAccent !== null && savedAccent !== '') {
                const hue = Math.max(0, Math.min(360, parseInt(savedAccent, 10) || 174));
                document.documentElement.style.setProperty('--accent-h', hue);
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
